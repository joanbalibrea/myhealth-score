<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="referrer" content="no-referrer" /><title>Reset password | MyHealth Score</title><link rel="stylesheet" href="../src/style.css" /></head>
<body class="login-page" data-recovery="reset">
<main class="login-screen">
<header class="login-brand"><div class="login-logo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 40C5 29 5 12 15 10c4-1 7 2 9 5 2-3 5-6 9-5 10 2 10 19-9 30Z" fill="currentColor"/><path d="M10 25h8l3-7 5 14 4-7h8" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="login-badge">∿ &nbsp; Empathetic Wellness</p><h1>MyHealth Score</h1></header>
<section class="login-card" aria-labelledby="recovery-title"><h2 id="recovery-title">Reset password</h2><p class="login-quick-intro">Choose a new password with at least 8 characters.</p>
<form id="recovery-form"><label for="new-password">New Password</label><div class="login-field"><input id="new-password" type="password" autocomplete="new-password" minlength="8" required disabled /><button type="button" data-password-toggle="new-password" aria-controls="new-password" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="M3 3l18 18" hidden /></svg></button></div>
<label for="confirm-password">Confirm New Password</label><div class="login-field"><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required disabled /><button type="button" data-password-toggle="confirm-password" aria-controls="confirm-password" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="M3 3l18 18" hidden /></svg></button></div><button class="login-submit" type="submit" disabled>Update Password</button></form>
<p id="recovery-status" class="login-status" role="status" aria-live="polite"></p>
<p><a href="forgot-password.html">Request a new reset link</a></p><button id="recovery-sign-out" type="button" class="login-submit" hidden>Sign out and return to Sign In</button>
<p class="recovery-back"><a id="recovery-sign-in" href="login.html">Back to Sign In</a></p>
</section></main><script type="module" src="../src/recovery-page.js"></script>  <script type="module" src="../src/visual-design.js"></script>
  </body></html>
