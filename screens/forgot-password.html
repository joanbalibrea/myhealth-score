<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="referrer" content="no-referrer" /><title>Forgot password? | MyHealth Score</title><link rel="stylesheet" href="../src/style.css" /></head>
<body class="login-page" data-recovery="request">
<main class="login-screen">
<header class="login-brand"><div class="login-logo" aria-hidden="true">♥<span></span></div><p class="login-badge">∿ &nbsp; Empathetic Wellness</p><h1>MyHealth Score</h1></header>
<section class="login-card" aria-labelledby="recovery-title"><h2 id="recovery-title">Forgot password?</h2><p class="login-quick-intro">Enter the email associated with your account and we'll send you a password reset link.</p>
<form id="recovery-form"><label for="recovery-email">Email</label><div class="login-field"><span aria-hidden="true">@</span><input id="recovery-email" type="email" autocomplete="email" placeholder="you@domain.com" required /></div><button class="login-submit" type="submit" >Send Reset Link</button></form>
<p id="recovery-status" class="login-status" role="status" aria-live="polite"></p>

<p class="recovery-back"><a id="recovery-sign-in" href="login.html">Back to Sign In</a></p>
</section></main><script type="module" src="../src/recovery-page.js"></script></body></html>
